<div class="page-content">
    <header class="page-header">
        <h2>הגדרות</h2>
    </header>

    <p-tabs [value]="activeTab()" (valueChange)="setActiveTab($event)" lazy>
        <p-tablist>
            <p-tab value="0"><i class="ph ph-plugs-connected"></i> מודלי AI</p-tab>
            <p-tab value="1"><i class="ph ph-compass"></i> ציידי הזנים</p-tab>
            <p-tab value="2"><i class="ph ph-database"></i> מסד נתונים</p-tab>
            <p-tab value="3"><i class="ph ph-palette"></i> מערכת עיצוב</p-tab>
        </p-tablist>
        <p-tabpanels>
            <p-tabpanel value="0">
                <app-llm-providers-management></app-llm-providers-management>
            </p-tabpanel>
            <p-tabpanel value="1">
                <ng-template #content>
                    <app-strain-hunter-settings></app-strain-hunter-settings>
                </ng-template>
            </p-tabpanel>
            <p-tabpanel value="2">
                <ng-template #content>
                    <app-database-monitor-settings></app-database-monitor-settings>
                </ng-template>
            </p-tabpanel>
            <p-tabpanel value="3">
                <ng-template #content>
                    <app-design-system></app-design-system>
                </ng-template>
            </p-tabpanel>
        </p-tabpanels>
    </p-tabs>
</div>
