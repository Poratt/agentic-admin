<div class="composer-area slide-up">
    <form [formGroup]="ideasForm" (ngSubmit)="onGenerate()">
        <div class="composer-field">
            <input
                #domainInput
                id="ideas-domain"
                type="text"
                formControlName="domain"
                [value]="store.domain()"
                (input)="onDomainInput($event)"
                placeholder="תחום עסקי (למשל: כלי AI לפרילנסרים)"
                autocomplete="off"
                (keydown.enter)="$event.preventDefault(); onGenerate()"
            />

            <div class="composer-meta-row">
                <div class="composer-count">
                    <div class="form-group-float">
                        <label class="float-label">כמות</label>
                        <div class="number-stepper">
                        <input
                            id="ideas-count"
                            type="number"
                            class="compact-input xs"
                            min="1"
                            max="10"
                            step="1"
                            [value]="store.count()"
                            (input)="onCountInput($event)"
                            [disabled]="store.loading()"
                        />
                        <div class="stepper-btns">
                            <button type="button" class="stepper-btn" (click)="incrementCount()" [disabled]="store.loading()">
                                <span class="ph ph-caret-up"></span>
                            </button>
                            <button type="button" class="stepper-btn" (click)="decrementCount()" [disabled]="store.loading()">
                                <span class="ph ph-caret-down"></span>
                            </button>
                        </div>
                    </div>
                    </div>
                </div>

                <div class="chat-prompt-actions-right">
                    <button type="button" class="sm" (click)="menu.toggle($event)">
                        <span>{{ selectedModel()?.label ?? 'בחר מודל' }}</span>
                        <span class="ph ph-caret-down"></span>
                    </button>
                    <p-tiered-menu
                        #menu
                        [model]="modelMenuItems()"
                        [popup]="true"
                        styleClass="chat-model-menu ltr"
                    >
                        <ng-template let-item pTemplate="item">
                            <div class="select-option">
                                <div class="select-option-main">
                                    <span class="item-name">{{ item.label }}</span>
                                    <span
                                        class="default-star"
                                        [class.default-star-active]="llmProviderStore.defaultModelId() === item.id"
                                    >
                                        <span
                                            [class]="llmProviderStore.defaultModelId() === item.id ? 'ph ph-star ph-fill' : 'ph ph-star'"
                                        ></span>
                                    </span>
                                    <div class="select-option-meta">
                                        <span
                                            class="perf-badge"
                                            [class.perf-good]="item.performancePercentage >= 80"
                                            [class.perf-warn]="item.performancePercentage >= 50 && item.performancePercentage < 80"
                                            [class.perf-bad]="item.performancePercentage < 50"
                                            >{{ item.performancePercentage }}%
                                        </span>
                                        <span class="latency-pill">
                                            <span class="ph ph-timer"></span>
                                            {{
                                                item.latencyAverageMs > 1000
                                                    ? (item.latencyAverageMs / 1000 | number: '1.1-1') + 's'
                                                    : item.latencyAverageMs + 'ms'
                                            }}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </ng-template>
                    </p-tiered-menu>

                    <button
                        [type]="store.loading() ? 'button' : 'submit'"
                        class="composer-submit"
                        [class.stop]="store.loading()"
                        [disabled]="store.loading() || !canGenerate()"
                        [attr.aria-label]="store.loading() ? 'עצור יצירה' : 'צור רעיונות'"
                        (click)="store.loading() ? onStopGenerate() : null"
                    >
                        @if (store.loading()) {
                            <span class="ph ph-stop sm"></span>
                        } @else {
                            <span class="ph ph-arrow-up sm"></span>
                        }
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
